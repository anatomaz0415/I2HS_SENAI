<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funções de Cálculo</title>
    <script>
        // Função de soma
        function somar() {  
            let num1 = parseFloat(document.getElementById('num1').value);
            let num2 = parseFloat(document.getElementById('num2').value);
            let resultado = num1 + num2;
            document.getElementById('resultado').innerText = 'Resultado: ' + resultado;
        }

        // Função de subtração
        function subtrair() {
            let num1 = parseFloat(document.getElementById('num1').value);
            let num2 = parseFloat(document.getElementById('num2').value);
            let resultado = num1 - num2;
            document.getElementById('resultado').innerText = 'Resultado: ' + resultado;
        }

        // Função de multiplicação
        function multiplicar() {
            let num1 = parseFloat(document.getElementById('num1').value);
            let num2 = parseFloat(document.getElementById('num2').value);
            let resultado = num1 * num2;
            document.getElementById('resultado').innerText = 'Resultado: ' + resultado;
        }

        // Função de divisão
        function dividir() {
            let num1 = parseFloat(document.getElementById('num1').value);
            let num2 = parseFloat(document.getElementById('num2').value);
            if (num2 === 0) {
                document.getElementById('resultado').innerText = 'Erro: Divisão por zero não é permitida!';
            } else {
                let resultado = num1 / num2;
                document.getElementById('resultado').innerText = 'Resultado: ' + resultado;
            }
        }
    </script>
</head>
<body>
    <h1>Calculadora em JavaScript</h1>
    
    <label for="num1">Número 1:</label>
    <input type="number" id="num1">
    <br><br>

    <label for="num2">Número 2:</label>
    <input type="number" id="num2">
    <br><br>

    <button onclick="somar()">Soma</button>
    <button onclick="subtrair()">Subtração</button>
    <button onclick="multiplicar()">Multiplicação</button>
    <button onclick="dividir()">Divisão</button>
    
    <h3 id="resultado">Resultado: </h3>
</body>
</html>
