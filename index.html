<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário Interativo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Cadastro de Usuário</h1>
  <form id="cadastroForm">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required>
    <span class="error" id="nomeError"></span><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>
    <span class="error" id="emailError"></span><br><br>

    <label for="telefone">Telefone:</label>
    <input type="tel" id="telefone" name="telefone" placeholder="(XX) XXXXX-XXXX">
    <span class="error" id="telefoneError"></span><br><br>

    <label for="dataAniversario">Data de Aniversário:</label>
    <input type="date" id="dataAniversario" name="dataAniversario" required>
    <span class="error" id="dataAniversarioError"></span><br><br>

    <label for="senha">Senha:</label>
    <input type="password" id="senha" name="senha">
    <span class="error" id="senhaError"></span><br><br>

    <button type="submit">Enviar</button>
  </form>

  <p id="mensagemSucesso" class="hidden">Cadastro realizado com sucesso!</p>

  <script src="script.js"></script>
</body>
</html>
